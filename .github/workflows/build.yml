name: Build and test

on:
  push:
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Run gateway simulation
        run: ./build/gateway_sim

  openmqttgateway-firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ZLab integration sources
        uses: actions/checkout@v4
        with:
          path: zlab
      - name: Check out official OpenMQTTGateway upstream
        uses: actions/checkout@v4
        with:
          repository: 1technophile/OpenMQTTGateway
          ref: development
          path: OpenMQTTGateway
      - name: Apply message guard integration
        run: python zlab/integration/OpenMQTTGateway/integrate.py OpenMQTTGateway
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio
      - name: Build ESP32 RF gateway firmware
        working-directory: OpenMQTTGateway
        run: pio run -e esp32dev-rf
